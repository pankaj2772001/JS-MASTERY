<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Animation: The Runner</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 50px; }
        #track { width: 100%; height: 150px; border-bottom: 2px solid #333; position: relative; }
        #runner { 
            width: 50px; height: 50px; background: red; 
            position: absolute; left: 0; bottom: 0; 
            border-radius: 0;
        }
    </style>
</head>
<body>

    <button id="start-race">Start Race!</button>
    <button id="reset-race">Back to Start</button>

    <div id="track">
        <div id="runner"></div>
    </div>

    <script>
        $(document).ready(function() {
            // Your Task:
            // 1. When #start-race is clicked, animate #runner to:
            //    - left: '200px'
            //    - opacity: '0.5'
            //    - height: '100px'

            $('#start-race').on('click', function(){

                $('#runner').animate({left: '200px', opacity: '0.5', height: '100px'},10000)
            })
            
            // 2. When #reset-race is clicked, animate it back to original:
            //    - left: '0'
            //    - opacity: '1'
            //    - height: '50px'

            $('#reset-race').on('click', function(){

                $('#runner').animate({left: '0', opacity: '1', height: '50px'},5000)
            })

        });

        /* DEVELOPER NOTES (Concept Explanation):
        --------------------------------------
        The .animate() method takes an object {} of CSS properties.
        Syntax: $(selector).animate({ property: value }, speed);

        IMPORTANT: 
        1. Only properties with NUMERIC values can be animated 
           (like width, margin, left, opacity). 
        2. Use camelCase for CSS names in JS (e.g., borderRadius instead of border-radius).
        3. The element MUST have 'position: relative' or 'absolute' to animate 'left/top'.
        */
    </script>
</body>
</html>
